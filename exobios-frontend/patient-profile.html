<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSync Pro - Patient Profile</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="design-system.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Use medical background from design-system */
        body {
            position: relative;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: var(--sp-lg);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-2xl);
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            padding: var(--sp-lg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
        }

        .header h1 {
            font-size: 1.75rem;
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--accent-500) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-back {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--primary-500);
            padding: var(--sp-sm) var(--sp-md);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all var(--transition-fast);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .btn-back:hover {
            background: rgba(34, 197, 94, 0.2);
            transform: translateY(-2px);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--sp-lg);
            margin-bottom: var(--sp-lg);
        }

        .card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--sp-xl);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            color: var(--primary-500);
            font-size: 0.875rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: var(--sp-lg);
            letter-spacing: 1px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: var(--sp-md) 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
            font-weight: 600;
        }

        .info-value {
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: var(--sp-md);
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: var(--sp-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: var(--sp-md);
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all var(--transition-fast);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent-500);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
            outline: none;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-600) 100%);
            color: white;
            border: none;
            padding: var(--sp-md) var(--sp-lg);
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all var(--transition-fast);
            font-size: 0.875rem;
            width: 100%;
            margin-top: var(--sp-md);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }

        .btn-primary:disabled {
            background: var(--bg-secondary);
            cursor: not-allowed;
            color: var(--text-muted);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: var(--danger-500);
            padding: var(--sp-sm) var(--sp-md);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            transition: all var(--transition-fast);
            text-transform: uppercase;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .emergency-contact-item {
            background: rgba(15, 23, 42, 0.5);
            padding: var(--sp-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--sp-sm);
            border-left: 3px solid var(--danger-500);
        }

        @media (max-width: 1024px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: var(--sp-md);
                align-items: flex-start;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: var(--sp-md);
            }

            .card {
                padding: var(--sp-lg);
            }

            .header h1 {
                font-size: 1.25rem;
            }
        }

        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 3px solid #5eead4;
        }

        .contact-info {
            flex: 1;
        }

        .contact-name {
            font-weight: 700;
            color: #f8fafc;
            font-size: 13px;
        }

        .contact-relation {
            color: #94a3b8;
            font-size: 11px;
            margin-top: 3px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .spinner {
            border: 3px solid rgba(94, 234, 212, 0.2);
            border-top-color: #5eead4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            min-width: 250px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.9);
            border-left: 4px solid #5eead4;
            border-radius: 6px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        @media (max-width: 768px) {

            .grid-2,
            .grid-3 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Patient Profile Management</h1>
            <div style="display: flex; gap: 10px;">
                <a href="javascript:void(0)" class="btn-back" onclick="manageAccess()"
                    style="background: rgba(94, 234, 212, 0.1); color: #5eead4;">👥 Manage Access</a>
                <a href="dashboard.html" class="btn-back">← Back</a>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading patient profile...</p>
        </div>

        <div id="content" style="display: none;">
            <!-- Basic Patient Info -->
            <div class="card" style="margin-bottom: 20px;">
                <h2 class="card-title">Patient Information</h2>
                <div class="grid-3">
                    <div>
                        <div class="info-label">Patient Name</div>
                        <div class="info-value" id="pat-name">Loading...</div>
                    </div>
                    <div>
                        <div class="info-label">Age</div>
                        <div class="info-value" id="pat-age">Loading...</div>
                    </div>
                    <div>
                        <div class="info-label">Sex</div>
                        <div class="info-value" id="pat-sex">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- Medical History -->
            <div class="card" style="margin-bottom: 20px;">
                <h2 class="card-title">Medical History</h2>
                <div class="form-group">
                    <label>Chronic Conditions</label>
                    <textarea id="chronic-conditions" placeholder="e.g., Diabetes, Hypertension"></textarea>
                </div>
                <div class="form-group">
                    <label>Allergies</label>
                    <textarea id="allergies" placeholder="e.g., Penicillin, Peanuts"></textarea>
                </div>
                <div class="form-group">
                    <label>Blood Type</label>
                    <input type="text" id="blood-type" placeholder="O+, A-, B+, etc.">
                </div>
                <div class="grid-2" style="margin-top: 15px;">
                    <div class="form-group">
                        <label>Height (cm)</label>
                        <input type="number" id="height" placeholder="175">
                    </div>
                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" id="weight" placeholder="75">
                    </div>
                </div>
                <button class="btn-primary" id="btn-save-history">Save Medical History</button>
            </div>

            <!-- Emergency Contacts -->
            <div class="card">
                <h2 class="card-title">Emergency Contacts</h2>
                <div id="emergency-contacts-list" style="margin-bottom: 20px;"></div>

                <div style="background: rgba(0,0,0,0.1); padding: 15px; border-radius: 8px;">
                    <h3 style="font-size: 13px; color: #5eead4; margin-bottom: 15px; text-transform: uppercase;">Add New
                        Contact</h3>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="contact-name" placeholder="Full name">
                    </div>
                    <div class="form-group">
                        <label>Relationship</label>
                        <select id="contact-relation">
                            <option>Father</option>
                            <option>Mother</option>
                            <option>Spouse</option>
                            <option>Sibling</option>
                            <option>Friend</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="contact-phone" placeholder="9876543210">
                    </div>
                    <button class="btn-primary" id="btn-add-contact">Add Contact</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let patientId = new URLSearchParams(window.location.search).get('id') || 1;

        function showToast(msg, color = '#5eead4') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            toast.style.borderLeftColor = color;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function getToken() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = 'index.html';
                return null;
            }
            return token;
        }

        function manageAccess() {
            window.location.href = `manage-patient-access.html?id=${patientId}`;
        }

        async function loadPatientProfile() {
            try {
                const token = getToken();
                const response = await fetch(`${API_BASE}/patients/${patientId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to load patient');

                const patient = await response.json();

                // Display basic info
                document.getElementById('pat-name').textContent = patient.name;
                document.getElementById('pat-age').textContent = patient.age;
                document.getElementById('pat-sex').textContent = patient.sex;

                // Load medical history if exists
                if (patient.medical_history) {
                    const med = patient.medical_history;
                    document.getElementById('chronic-conditions').value = med.chronic_conditions || '';
                    document.getElementById('allergies').value = med.allergies || '';
                    document.getElementById('blood-type').value = med.blood_type || '';
                    document.getElementById('height').value = med.height_cm || '';
                    document.getElementById('weight').value = med.weight_kg || '';
                }

                // Display emergency contacts
                displayEmergencyContacts(patient.emergency_contacts || []);

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (e) {
                showToast('Error: ' + e.message, '#ef4444');
                document.getElementById('loading').innerHTML = '<p style="color: #ef4444;">Error loading profile</p>';
            }
        }

        function displayEmergencyContacts(contacts) {
            const list = document.getElementById('emergency-contacts-list');
            if (contacts.length === 0) {
                list.innerHTML = '<p style="color: #94a3b8; font-size: 12px;">No emergency contacts added yet</p>';
                return;
            }
            list.innerHTML = contacts.map(c => `
                <div class="emergency-contact-item">
                    <div class="contact-info">
                        <div class="contact-name">${c.name}</div>
                        <div class="contact-relation">${c.relationship} • ${c.phone_primary}</div>
                    </div>
                    <button class="btn-danger" onclick="deleteContact(${c.id})">Delete</button>
                </div>
            `).join('');
        }

        async function savemedicalHistory() {
            try {
                const token = getToken();
                const btn = document.getElementById('btn-save-history');
                btn.disabled = true;

                const data = {
                    chronic_conditions: document.getElementById('chronic-conditions').value,
                    allergies: document.getElementById('allergies').value,
                    blood_type: document.getElementById('blood-type').value,
                    height_cm: parseFloat(document.getElementById('height').value) || null,
                    weight_kg: parseFloat(document.getElementById('weight').value) || null
                };

                const response = await fetch(`${API_BASE}/patients/${patientId}/medical-history`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Failed to save');

                showToast('Medical history saved successfully!');
                btn.disabled = false;
            } catch (e) {
                showToast('Error: ' + e.message, '#ef4444');
                document.getElementById('btn-save-history').disabled = false;
            }
        }

        async function addEmergencyContact() {
            try {
                const token = getToken();
                const btn = document.getElementById('btn-add-contact');
                btn.disabled = true;

                const data = {
                    patient_id: patientId,
                    name: document.getElementById('contact-name').value.trim(),
                    relationship: document.getElementById('contact-relation').value,
                    phone_primary: document.getElementById('contact-phone').value.trim()
                };

                if (!data.name || !data.phone_primary) {
                    showToast('Please fill in all fields', '#ef4444');
                    btn.disabled = false;
                    return;
                }

                const response = await fetch(`${API_BASE}/patients/${patientId}/emergency-contacts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) throw new Error('Failed to add contact');

                showToast('Emergency contact added!');
                document.getElementById('contact-name').value = '';
                document.getElementById('contact-phone').value = '';

                loadPatientProfile();
            } catch (e) {
                showToast('Error: ' + e.message, '#ef4444');
                document.getElementById('btn-add-contact').disabled = false;
            }
        }

        async function deleteContact(contactId) {
            if (!confirm('Delete this contact?')) return;

            try {
                const token = getToken();
                const response = await fetch(`${API_BASE}/patients/emergency-contacts/${contactId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Failed to delete');

                showToast('Contact deleted');
                loadPatientProfile();
            } catch (e) {
                showToast('Error: ' + e.message, '#ef4444');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadPatientProfile();
            document.getElementById('btn-save-history').addEventListener('click', savemedicalHistory);
            document.getElementById('btn-add-contact').addEventListener('click', addEmergencyContact);
        });
    </script>
</body>

</html>

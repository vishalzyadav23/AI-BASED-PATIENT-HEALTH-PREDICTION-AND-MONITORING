<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSync Pro - Patient History</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="design-system.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Use medical background from design-system */
        body {
            position: relative;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: var(--sp-lg);
        }

        .header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            padding: var(--sp-lg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            margin-bottom: var(--sp-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--sp-sm);
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--accent-500) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-left p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .btn-back {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--primary-500);
            padding: var(--sp-sm) var(--sp-md);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            transition: all var(--transition-fast);
        }

        .btn-back:hover {
            background: rgba(34, 197, 94, 0.2);
            transform: translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--sp-lg);
            margin-bottom: var(--sp-lg);
        }

        .panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: var(--sp-lg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-500);
            margin-bottom: var(--sp-md);
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--sp-md) 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .metric-value {
            color: var(--accent-500);
            font-weight: 700;
            font-size: 0.95rem;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: var(--sp-sm);
        }

        .status-stable {
            background: var(--primary-500);
        }

        .status-warning {
            background: var(--warning-500);
        }

        .status-critical {
            background: var(--danger-500);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .vitals-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--sp-md);
        }

        .vital-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: var(--sp-md);
            text-align: center;
        }

        .vital-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: var(--sp-sm);
        }

        .vital-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent-500);
        }

        .vital-unit {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .vitals-history {
            margin-top: var(--sp-md);
            max-height: 300px;
            overflow-y: auto;
        }

        .history-entry {
            padding: var(--sp-sm) 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.875rem;
        }

        .history-entry .time {
            color: var(--text-muted);
        }

        .history-entry .values {
            color: var(--accent-500);
            font-weight: 600;
            margin-top: var(--sp-xs);
        }

        .alerts-section {
            max-height: 250px;
            overflow-y: auto;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .vitals-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                gap: var(--sp-md);
            }

            .vitals-container {
                grid-template-columns: 1fr;
            }
        }

        .alert {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .alert.warning {
            background: rgba(245, 158, 11, 0.1);
            border-left-color: #f59e0b;
        }

        .alert.info {
            background: rgba(56, 189, 248, 0.1);
            border-left-color: #38bdf8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .spinner {
            border: 3px solid rgba(94, 234, 212, 0.2);
            border-top-color: #5eead4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .vitals-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1 id="patient-name">Patient Health History</h1>
                <p id="patient-info">Loading...</p>
            </div>
            <button class="btn-back" onclick="window.history.back()">Back</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading patient data...</p>
        </div>

        <div id="content" style="display: none;">
            <div class="grid">
                <div class="panel">
                    <h2>Current Vitals</h2>
                    <div class="vitals-container">
                        <div class="vital-card">
                            <div class="vital-label">Heart Rate</div>
                            <div class="vital-value" id="vital-hr">--</div>
                            <div class="vital-unit">bpm</div>
                        </div>
                        <div class="vital-card">
                            <div class="vital-label">SpO2</div>
                            <div class="vital-value" id="vital-spo2">--</div>
                            <div class="vital-unit">%</div>
                        </div>
                        <div class="vital-card">
                            <div class="vital-label">Temperature</div>
                            <div class="vital-value" id="vital-temp">--</div>
                            <div class="vital-unit">°C</div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h2>Medical Status</h2>
                    <div class="metric-row">
                        <span class="metric-label">Risk Level</span>
                        <span><span class="status-indicator status-stable"></span><span id="risk-level"
                                class="metric-value">STABLE</span></span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Blood Type</span>
                        <span id="blood-type" class="metric-value">--</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Allergies</span>
                        <span id="allergies" class="metric-value">None</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Chronic Conditions</span>
                        <span id="conditions" class="metric-value">None</span>
                    </div>
                </div>

                <div class="panel full-width">
                    <h2>Vitals History (24 Hours)</h2>
                    <div class="vitals-history" id="vitals-history">
                        <p style="color: #94a3b8; font-size: 12px;">Loading vitals data...</p>
                    </div>
                </div>

                <div class="panel full-width">
                    <h2>Recent Alerts</h2>
                    <div class="alerts-section" id="alerts-section">
                        <p style="color: #94a3b8; font-size: 12px;">No alerts</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');

        function getCaregiverToken() {
            const token = localStorage.getItem('caregiverToken');
            if (!token) {
                window.location.href = 'caregiver-login.html';
                return null;
            }
            return token;
        }

        async function loadPatientHistory() {
            try {
                const token = getCaregiverToken();

                // 🚀 MANAGER DEMO INTERCEPTOR
                if (token === 'demo_token_12345') {
                    const demoPatient = {
                        patient_id: 1,
                        patient_name: "Rajesh Kumar",
                        patient_age: 45,
                        patient_sex: "Male",
                        current_risk_level: "HIGH",
                        medical_history: {
                            blood_type: "O+",
                            allergies: "Penicillin",
                            chronic_conditions: "Hypertension, Asthma"
                        }
                    };

                    const now = new Date();
                    const demoVitals = [
                        { recorded_at: now.toISOString(), heart_rate: 110, spo2: 92, temperature: 38.5 },
                        { recorded_at: new Date(now.getTime() - 15 * 60000).toISOString(), heart_rate: 108, spo2: 93, temperature: 38.2 },
                        { recorded_at: new Date(now.getTime() - 60 * 60000).toISOString(), heart_rate: 98, spo2: 96, temperature: 37.5 },
                        { recorded_at: new Date(now.getTime() - 120 * 60000).toISOString(), heart_rate: 85, spo2: 98, temperature: 37.1 }
                    ];

                    displayPatientHistory(demoPatient, demoVitals);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    return;
                }

                // Standard API Request
                const patientRes = await fetch(`${API_BASE}/patients/${patientId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!patientRes.ok) throw new Error('Patient not found');
                const patient = await patientRes.json();

                const vitalsRes = await fetch(`${API_BASE}/patients/${patientId}/readings`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const vitals = vitalsRes.ok ? await vitalsRes.json() : [];

                displayPatientHistory(patient, vitals);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').innerHTML =
                    `<p style="color: #ef4444;">Error: ${e.message}</p>`;
            }
        }

        function displayPatientHistory(patient, vitals) {
            const latest = vitals[0];

            document.getElementById('patient-name').textContent = patient.patient_name;
            document.getElementById('patient-info').textContent =
                `${patient.patient_age} years • ${patient.patient_sex}`;

            if (latest) {
                document.getElementById('vital-hr').textContent = latest.heart_rate || '--';
                document.getElementById('vital-spo2').textContent = latest.spo2 || '--';
                document.getElementById('vital-temp').textContent = latest.temperature || '--';
            }

            document.getElementById('blood-type').textContent =
                patient.medical_history?.blood_type || '--';
            document.getElementById('allergies').textContent =
                patient.medical_history?.allergies || 'None documented';
            document.getElementById('conditions').textContent =
                patient.medical_history?.chronic_conditions || 'None documented';

            const riskLevel = patient.current_risk_level || 'STABLE';
            const riskElement = document.getElementById('risk-level');
            const indicator = riskElement.parentElement.querySelector('.status-indicator');

            riskElement.textContent = riskLevel;
            indicator.className = 'status-indicator ' +
                (riskLevel === 'CRITICAL' ? 'status-critical' :
                    riskLevel === 'HIGH' ? 'status-warning' : 'status-stable');

            const historyDiv = document.getElementById('vitals-history');
            if (vitals.length > 0) {
                historyDiv.innerHTML = vitals.slice(0, 10).map(v => `
                    <div class="history-entry">
                        <div class="time">${new Date(v.recorded_at || v.timestamp).toLocaleString()}</div>
                        <div class="values">
                            HR: ${v.heart_rate || '--'} | SpO2: ${v.spo2 || '--'}% | Temp: ${v.temperature || '--'}°C
                        </div>
                    </div>
                `).join('');
            }

            const alertsDiv = document.getElementById('alerts-section');
            const alerts = [];

            if (latest?.heart_rate > 100) {
                alerts.push({ type: 'warning', msg: `High heart rate detected: ${latest.heart_rate} bpm` });
            }
            if (latest?.spo2 < 95) {
                alerts.push({ type: 'critical', msg: `Low oxygen saturation: ${latest.spo2}%` });
            }
            if (latest?.temperature > 38.5) {
                alerts.push({ type: 'critical', msg: `High fever detected: ${latest.temperature}°C` });
            }

            if (alerts.length > 0) {
                alertsDiv.innerHTML = alerts.map(a => `
                    <div class="alert ${a.type}">
                        <strong>Alert:</strong> ${a.msg}
                    </div>
                `).join('');
            } else {
                alertsDiv.innerHTML = '<p style="color: #94a3b8; font-size: 12px;">No active alerts</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!patientId && getCaregiverToken() !== 'demo_token_12345') {
                document.getElementById('loading').innerHTML =
                    '<p style="color: #ef4444;">Invalid patient ID</p>';
            } else {
                loadPatientHistory();
            }
        });
    </script>
</body>

</html>

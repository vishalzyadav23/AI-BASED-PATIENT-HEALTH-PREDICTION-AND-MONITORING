<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Health History - Exobios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0f172a 0%, #020617 100%);
            background-attachment: fixed;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            padding: 20px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .header-left p {
            font-size: 12px;
            color: #94a3b8;
        }

        .btn-back {
            background: rgba(94, 234, 212, 0.1);
            border: 1px solid rgba(94, 234, 212, 0.3);
            color: #5eead4;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-back:hover {
            background: rgba(94, 234, 212, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .panel h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5eead4;
            margin-bottom: 15px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: #94a3b8;
            font-size: 12px;
        }

        .metric-value {
            color: #5eead4;
            font-weight: 700;
            font-size: 14px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-stable {
            background: #22c55e;
        }

        .status-warning {
            background: #f59e0b;
        }

        .status-critical {
            background: #ef4444;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .vitals-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .vital-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(94, 234, 212, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .vital-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .vital-value {
            font-size: 24px;
            font-weight: 700;
            color: #5eead4;
        }

        .vital-unit {
            font-size: 11px;
            color: #64748b;
        }

        .vitals-history {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .history-entry {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
        }

        .history-entry .time {
            color: #94a3b8;
        }

        .history-entry .values {
            color: #5eead4;
            font-weight: 600;
            margin-top: 3px;
        }

        .alerts-section {
            max-height: 250px;
            overflow-y: auto;
        }

        .alert {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .alert.warning {
            background: rgba(245, 158, 11, 0.1);
            border-left-color: #f59e0b;
        }

        .alert.info {
            background: rgba(56, 189, 248, 0.1);
            border-left-color: #38bdf8;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .spinner {
            border: 3px solid rgba(94, 234, 212, 0.2);
            border-top-color: #5eead4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .trend-chart {
            margin-top: 15px;
            height: 200px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(94, 234, 212, 0.2);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            gap: 5px;
        }

        .chart-bar {
            width: 100%;
            background: rgba(94, 234, 212, 0.3);
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            transition: 0.2s;
        }

        .chart-bar:hover {
            background: rgba(94, 234, 212, 0.6);
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .vitals-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1 id="patient-name">Patient Health History</h1>
                <p id="patient-info">Loading...</p>
            </div>
            <button class="btn-back" onclick="window.history.back()">Back</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading patient data...</p>
        </div>

        <div id="content" style="display: none;">
            <div class="grid">
                <!-- Current Vitals -->
                <div class="panel">
                    <h2>Current Vitals</h2>
                    <div class="vitals-container">
                        <div class="vital-card">
                            <div class="vital-label">Heart Rate</div>
                            <div class="vital-value" id="vital-hr">--</div>
                            <div class="vital-unit">bpm</div>
                        </div>
                        <div class="vital-card">
                            <div class="vital-label">SpO2</div>
                            <div class="vital-value" id="vital-spo2">--</div>
                            <div class="vital-unit">%</div>
                        </div>
                        <div class="vital-card">
                            <div class="vital-label">Temperature</div>
                            <div class="vital-value" id="vital-temp">--</div>
                            <div class="vital-unit">°C</div>
                        </div>
                    </div>
                </div>

                <!-- Medical Status -->
                <div class="panel">
                    <h2>Medical Status</h2>
                    <div class="metric-row">
                        <span class="metric-label">Risk Level</span>
                        <span><span class="status-indicator status-stable"></span><span id="risk-level"
                                class="metric-value">STABLE</span></span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Blood Type</span>
                        <span id="blood-type" class="metric-value">--</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Allergies</span>
                        <span id="allergies" class="metric-value">None</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Chronic Conditions</span>
                        <span id="conditions" class="metric-value">None</span>
                    </div>
                </div>

                <!-- Vitals History -->
                <div class="panel full-width">
                    <h2>Vitals History (24 Hours)</h2>
                    <div class="vitals-history" id="vitals-history">
                        <p style="color: #94a3b8; font-size: 12px;">Loading vitals data...</p>
                    </div>
                </div>

                <!-- Alerts & Notifications -->
                <div class="panel full-width">
                    <h2>Recent Alerts</h2>
                    <div class="alerts-section" id="alerts-section">
                        <p style="color: #94a3b8; font-size: 12px;">No alerts</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://exobios-backend.onrender.com/api';
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('id');

        function getCaregiverToken() {
            const token = localStorage.getItem('caregiverToken');
            if (!token) {
                window.location.href = 'caregiver-login.html';
                return null;
            }
            return token;
        }

        async function loadPatientHistory() {
            try {
                const token = getCaregiverToken();

                // Fetch patient details
                const patientRes = await fetch(`${API_BASE}/patients/${patientId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!patientRes.ok) throw new Error('Patient not found');
                const patient = await patientRes.json();

                // Fetch vitals/predictions
                const vitalsRes = await fetch(`${API_BASE}/patients/${patientId}/readings`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const vitals = vitalsRes.ok ? await vitalsRes.json() : [];

                displayPatientHistory(patient, vitals);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (e) {
                document.getElementById('loading').innerHTML =
                    `<p style="color: #ef4444;">Error: ${e.message}</p>`;
            }
        }

        function displayPatientHistory(patient, vitals) {
            const latest = vitals[0];

            document.getElementById('patient-name').textContent = patient.patient_name;
            document.getElementById('patient-info').textContent =
                `${patient.patient_age} years • ${patient.patient_sex}`;

            if (latest) {
                document.getElementById('vital-hr').textContent = latest.heart_rate || '--';
                document.getElementById('vital-spo2').textContent = latest.spo2 || '--';
                document.getElementById('vital-temp').textContent = latest.temperature || '--';
            }

            document.getElementById('blood-type').textContent =
                patient.medical_history?.blood_type || '--';
            document.getElementById('allergies').textContent =
                patient.medical_history?.allergies || 'None documented';
            document.getElementById('conditions').textContent =
                patient.medical_history?.chronic_conditions || 'None documented';

            // Determine risk level color
            const riskLevel = patient.current_risk_level || 'STABLE';
            const riskElement = document.getElementById('risk-level');
            const indicator = riskElement.parentElement.querySelector('.status-indicator');

            riskElement.textContent = riskLevel;
            indicator.className = 'status-indicator ' +
                (riskLevel === 'CRITICAL' ? 'status-critical' :
                    riskLevel === 'ALERT' ? 'status-warning' : 'status-stable');

            // Display vitals history
            const historyDiv = document.getElementById('vitals-history');
            if (vitals.length > 0) {
                historyDiv.innerHTML = vitals.slice(0, 10).map(v => `
                    <div class="history-entry">
                        <div class="time">${new Date(v.recorded_at || v.timestamp).toLocaleString()}</div>
                        <div class="values">
                            HR: ${v.heart_rate || '--'} | SpO2: ${v.spo2 || '--'}% | Temp: ${v.temperature || '--'}°C
                        </div>
                    </div>
                `).join('');
            }

            // Display alerts
            const alertsDiv = document.getElementById('alerts-section');
            const alerts = [];

            if (latest?.heart_rate > 100) {
                alerts.push({ type: 'warning', msg: `High heart rate detected: ${latest.heart_rate} bpm` });
            }
            if (latest?.spo2 < 95) {
                alerts.push({ type: 'critical', msg: `Low oxygen saturation: ${latest.spo2}%` });
            }
            if (latest?.temperature > 38.5) {
                alerts.push({ type: 'critical', msg: `High fever detected: ${latest.temperature}°C` });
            }

            if (alerts.length > 0) {
                alertsDiv.innerHTML = alerts.map(a => `
                    <div class="alert ${a.type}">
                        <strong>Alert:</strong> ${a.msg}
                    </div>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!patientId) {
                document.getElementById('loading').innerHTML =
                    '<p style="color: #ef4444;">Invalid patient ID</p>';
            } else {
                loadPatientHistory();
            }
        });
    </script>
</body>

</html>
